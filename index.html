<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Delta Lot Size Calculator</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f3f4f6;
    font-family:Arial,sans-serif;
    color:#111827
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px
}

.card{
    background:#fff;
    padding:22px;
    border-radius:18px;
    box-shadow:0 8px 30px #0001
}

h1{
    margin:0 0 5px;
    font-size:25px
}

.sub{
    color:#6b7280;
    font-size:14px;
    margin-bottom:20px
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin:14px 0 6px
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px
}

.result{
    margin-top:20px;
    background:#111827;
    color:white;
    border-radius:15px;
    padding:18px
}

.small{
    color:#d1d5db;
    font-size:12px
}

.lot{
    font-size:36px;
    font-weight:bold;
    margin:5px 0 15px
}

.row{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #ffffff22;
    padding:9px 0
}

.note{
    font-size:12px;
    color:#6b7280;
    line-height:1.5;
    margin-top:14px
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Delta Lot Size Calculator</h1>

<div class="sub">
Capital + leverage + SL risk
</div>

<label>Capital / Margin (₹)</label>
<input id="capital" type="number" value="500" min="0">

<label>Maximum SL Loss (₹)</label>
<input id="risk" type="number" value="500" min="0">

<label>Leverage (×)</label>
<input id="leverage" type="number" value="100" min="1">

<label>Entry Price (USD)</label>
<input id="entry" type="number" value="70" min="0" step="0.0001">

<label>Stop Loss Price (USD)</label>
<input id="sl" type="number" value="72" min="0" step="0.0001">

<div class="result">

<div class="small">FINAL LOT SIZE</div>

<div class="lot" id="finalLot">Loading...</div>

<div class="row">
<span>Trade Value</span>
<b id="tradeValue">—</b>
</div>

<div class="row">
<span>Leverage Max Lot</span>
<b id="maxLot">—</b>
</div>

<div class="row">
<span>Risk-Based Lot</span>
<b id="riskLot">—</b>
</div>

<div class="row">
<span>SL Loss</span>
<b id="slLoss">—</b>
</div>

</div>

<div class="note">
USD/INR: <b id="usdInrRate">Loading...</b><br>
Formula: Final Lot Size = lower of leverage-based lot and risk-based lot.
Fees, funding and slippage are not included.
</div>

</div>
</div>

<script>

let USDINR = null;


/* =========================================
   LIVE USD/INR
   Primary: ExchangeRate-API
   Backup: Frankfurter
========================================= */

async function getUsdInrFromPrimary(){

    const response = await fetch(
        "https://open.er-api.com/v6/latest/USD",
        {
            cache:"no-store"
        }
    );

    if(!response.ok){
        throw new Error("Primary USD/INR request failed");
    }

    const data = await response.json();

    if(
        data.result !== "success" ||
        !data.rates ||
        !data.rates.INR
    ){
        throw new Error("Invalid primary USD/INR response");
    }

    return Number(data.rates.INR);
}


async function getUsdInrFromBackup(){

    const response = await fetch(
        "https://api.frankfurter.app/latest?from=USD&to=INR",
        {
            cache:"no-store"
        }
    );

    if(!response.ok){
        throw new Error("Backup USD/INR request failed");
    }

    const data = await response.json();

    if(!data.rates || !data.rates.INR){
        throw new Error("Invalid backup USD/INR response");
    }

    return Number(data.rates.INR);
}


async function updateUsdInr(){

    const rateElement =
        document.getElementById("usdInrRate");


    try{

        /* Try primary source first */

        USDINR =
            await getUsdInrFromPrimary();


        if(
            !Number.isFinite(USDINR) ||
            USDINR <= 0
        ){
            throw new Error("Invalid USD/INR rate");
        }


        rateElement.textContent =
            "₹" + USDINR.toFixed(2) + " (live)";


        calc();


    }catch(primaryError){

        console.warn(
            "Primary USD/INR source failed:",
            primaryError
        );


        try{

            /* Try backup source */

            USDINR =
                await getUsdInrFromBackup();


            if(
                !Number.isFinite(USDINR) ||
                USDINR <= 0
            ){
                throw new Error("Invalid backup USD/INR rate");
            }


            rateElement.textContent =
                "₹" + USDINR.toFixed(2) + " (live)";


            calc();


        }catch(backupError){

            console.error(
                "All USD/INR sources failed:",
                backupError
            );


            /*
               If a previous live rate exists,
               keep using it instead of breaking
               the calculator.
            */

            if(
                USDINR !== null &&
                Number.isFinite(USDINR) &&
                USDINR > 0
            ){

                rateElement.textContent =
                    "₹" + USDINR.toFixed(2) +
                    " (last available)";

                calc();

            }else{

                rateElement.textContent =
                    "Unavailable";

                document.getElementById("finalLot")
                    .textContent = "—";

                document.getElementById("tradeValue")
                    .textContent = "—";

                document.getElementById("maxLot")
                    .textContent = "—";

                document.getElementById("riskLot")
                    .textContent = "—";

                document.getElementById("slLoss")
                    .textContent = "—";
            }
        }
    }
}


/* =========================================
   CALCULATOR
========================================= */

function calc(){

    const c =
        Number(
            document.getElementById("capital").value
        );

    const r =
        Number(
            document.getElementById("risk").value
        );

    const l =
        Number(
            document.getElementById("leverage").value
        );

    const e =
        Number(
            document.getElementById("entry").value
        );

    const s =
        Number(
            document.getElementById("sl").value
        );


    /*
       Check inputs
    */

    if(
        !(
            c > 0 &&
            r >= 0 &&
            l > 0 &&
            e > 0 &&
            s > 0
        )
    ){

        document.getElementById("finalLot")
            .textContent = "—";

        return;
    }


    /*
       USD/INR not available yet
    */

    if(
        USDINR === null ||
        !Number.isFinite(USDINR) ||
        USDINR <= 0
    ){

        document.getElementById("finalLot")
            .textContent = "—";

        return;
    }


    /*
       Entry and SL cannot be identical
    */

    if(s === e){

        document.getElementById("finalLot")
            .textContent = "—";

        document.getElementById("tradeValue")
            .textContent = "—";

        document.getElementById("maxLot")
            .textContent = "—";

        document.getElementById("riskLot")
            .textContent = "—";

        document.getElementById("slLoss")
            .textContent = "—";

        return;
    }


    /*
       Total trade value in INR

       Capital × Leverage
    */

    const trade =
        c * l;


    /*
       Maximum lot allowed by leverage

       INR trade value
       → USD trade value
       → divide by entry price
    */

    const max =
        (trade / USDINR) / e;


    /*
       Maximum lot allowed by SL risk

       Maximum INR loss
       → USD loss
       → divide by USD loss per lot
    */

    const riskLotValue =
        (r / USDINR) /
        Math.abs(s - e);


    /*
       Final lot size

       Lower of:
       1. Leverage limit
       2. Risk limit
    */

    const final =
        Math.min(
            max,
            riskLotValue
        );


    /*
       Display final lot
    */

    document.getElementById("finalLot")
        .textContent =
        final.toFixed(3) + " lots";


    /*
       Trade value
    */

    document.getElementById("tradeValue")
        .textContent =
        "₹" +
        trade.toLocaleString("en-IN");


    /*
       Leverage maximum lot
    */

    document.getElementById("maxLot")
        .textContent =
        max.toFixed(3);


    /*
       Risk based lot
    */

    document.getElementById("riskLot")
        .textContent =
        riskLotValue.toFixed(3);


    /*
       Actual SL loss at final lot
    */

    document.getElementById("slLoss")
        .textContent =
        "₹" +
        (
            final *
            Math.abs(s - e) *
            USDINR
        ).toFixed(2);
}


/* =========================================
   INPUT UPDATES
========================================= */

document
    .querySelectorAll("input")
    .forEach(function(x){

        x.addEventListener(
            "input",
            calc
        );

    });


/* =========================================
   INITIAL USD/INR UPDATE
========================================= */

updateUsdInr();


/* =========================================
   AUTO REFRESH EVERY 5 MINUTES
========================================= */

setInterval(
    updateUsdInr,
    5 * 60 * 1000
);

</script>

</body>
</html>
