<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Delta Lot Size Calculator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin:0 0 25px;
    font-size:25px;
}

label{
    display:block;
    font-weight:600;
    margin-top:15px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus,select:focus{
    border-color:#2563eb;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.rate{
    text-align:center;
    margin-top:16px;
    font-size:14px;
    color:#374151;
}

.results{
    margin-top:22px;
    display:none;
}

.result-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
}

.result-title{
    font-size:13px;
    color:#6b7280;
    margin-bottom:5px;
}

.result-value{
    font-size:20px;
    font-weight:bold;
}

.lot{
    background:#eff6ff;
    border:2px solid #2563eb;
}

.lot .result-value{
    color:#2563eb;
    font-size:26px;
}

.profit{
    color:#16a34a !important;
}

.loss{
    color:#dc2626 !important;
}

.small{
    font-size:14px;
    font-weight:normal;
    color:#6b7280;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.popup-card{
    background:white;
    width:100%;
    max-width:450px;
    border-radius:15px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.popup-card h2{
    margin-top:0;
}

.close{
    background:#111827;
    margin-top:15px;
}

.note{
    font-size:12px;
    color:#6b7280;
    margin-top:15px;
    line-height:1.5;
}

@media(max-width:500px){
    .row{
        grid-template-columns:1fr;
    }

    .container{
        margin:10px auto;
        padding:12px;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Delta Lot Size Calculator</h1>

<label>Position</label>
<select id="position">
    <option value="long">Long</option>
    <option value="short">Short</option>
</select>

<label>Entry Price (USD)</label>
<input type="number" id="entry" step="0.01" placeholder="Example: 100000">

<label>Stop Loss Price (USD)</label>
<input type="number" id="stop" step="0.01" placeholder="Example: 99000">

<label>Exit Price (USD)</label>
<input type="number" id="exit" step="0.01" placeholder="Example: 105000">

<div class="row">

<div>
<label>Trade Value (₹)</label>
<input type="number" id="tradeValue" value="20000" min="1">
</div>

<div>
<label>Leverage</label>
<input type="number" id="leverage" value="100" min="1">
</div>

</div>

<label>Maximum Risk (₹)</label>
<input type="number" id="risk" value="200" min="0">

<button onclick="calculate()">CALCULATE</button>

<div class="rate">
    USD/INR: <strong id="usdRate">Loading...</strong>
</div>

<div class="results" id="results">

<div class="result-box lot">
    <div class="result-title">FINAL LOT SIZE</div>
    <div class="result-value" id="finalLot">-</div>
</div>

<div class="result-box">
    <div class="result-title">Trade Value</div>
    <div class="result-value" id="tradeResult">-</div>
</div>

<div class="result-box">
    <div class="result-title">Leverage Max Lot</div>
    <div class="result-value" id="maxLot">-</div>
</div>

<div class="result-box">
    <div class="result-title">Risk-Based Lot</div>
    <div class="result-value" id="riskLot">-</div>
</div>

<div class="result-box">
    <div class="result-title">SL Loss</div>
    <div class="result-value loss" id="slLoss">-</div>
</div>

<div class="result-box">
    <div class="result-title">Price Difference</div>
    <div class="result-value" id="priceDiff">-</div>
</div>

<div class="result-box">
    <div class="result-title">Expected P&L</div>
    <div class="result-value" id="pnl">-</div>
</div>

<div class="note">
    1 lot = 0.001 BTC.<br>
    Fees, funding and slippage are not included.
</div>

</div>

</div>
</div>


<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-card">

<h2>Calculation Result</h2>

<p>
<strong>Position:</strong>
<span id="popupPosition"></span>
</p>

<p>
<strong>Final Lot Size:</strong>
<span id="popupLot"></span>
</p>

<p>
<strong>Expected P&L:</strong>
<span id="popupPnl"></span>
</p>

<button class="close" onclick="closePopup()">CLOSE</button>

</div>

</div>


<script>

/*
====================================================
SETTINGS
====================================================
*/

// Delta Exchange contract size
// 1 lot = 0.001 BTC
const BTC_PER_LOT = 0.001;

let USDINR = 95.79;


/*
====================================================
GET USD / INR RATE
====================================================
*/

async function getUsdRate(){

    try{

        const response = await fetch(
            "https://api.frankfurter.app/latest?from=USD&to=INR"
        );

        const data = await response.json();

        if(data && data.rates && data.rates.INR){

            USDINR = Number(data.rates.INR);

        }

    }catch(error){

        console.log("Using fallback USD/INR rate.");

    }

    document.getElementById("usdRate").innerHTML =
        "₹" + USDINR.toFixed(2) + " (live)";

}


/*
====================================================
FORMAT FUNCTIONS
====================================================
*/

function rupee(value){

    return "₹" + Number(value).toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });

}


function dollar(value){

    return "$" + Number(value).toLocaleString("en-US",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });

}


function rupeeDollar(rupeeValue){

    const usdValue = rupeeValue / USDINR;

    return rupee(rupeeValue) +
           " <span class='small'>(" +
           dollar(usdValue) +
           ")</span>";

}


function usdRupee(usdValue){

    const inrValue = usdValue * USDINR;

    return rupee(inrValue) +
           " <span class='small'>(" +
           dollar(usdValue) +
           ")</span>";

}


function signedUsdRupee(usdValue){

    const inrValue = usdValue * USDINR;

    const signINR = inrValue >= 0 ? "+" : "";
    const signUSD = usdValue >= 0 ? "+" : "";

    return signINR +
           rupee(Math.abs(inrValue)) +
           " <span class='small'>(" +
           signUSD +
           dollar(Math.abs(usdValue)) +
           ")</span>";

}


/*
====================================================
CALCULATE
====================================================
*/

function calculate(){

    const position =
        document.getElementById("position").value;

    const entry =
        Number(document.getElementById("entry").value);

    const stop =
        Number(document.getElementById("stop").value);

    const exit =
        Number(document.getElementById("exit").value);

    const tradeValueINR =
        Number(document.getElementById("tradeValue").value);

    const leverage =
        Number(document.getElementById("leverage").value);

    const riskINR =
        Number(document.getElementById("risk").value);


    /*
    ---------------------------------------------
    VALIDATION
    ---------------------------------------------
    */

    if(
        !entry ||
        !stop ||
        !exit ||
        !tradeValueINR ||
        !leverage
    ){

        alert("Please enter all required values.");
        return;
    }


    if(entry <= 0 || stop <= 0 || exit <= 0){

        alert("Price must be greater than zero.");
        return;
    }


    /*
    ---------------------------------------------
    PRICE DIFFERENCE
    ---------------------------------------------
    */

    let slDifference;
    let exitDifference;

    if(position === "long"){

        slDifference = entry - stop;
        exitDifference = exit - entry;

    }else{

        slDifference = stop - entry;
        exitDifference = entry - exit;

    }


    /*
    ---------------------------------------------
    VALIDATE STOP LOSS
    ---------------------------------------------
    */

    if(slDifference <= 0){

        alert(
            position === "long"
            ? "For LONG, Stop Loss must be below Entry Price."
            : "For SHORT, Stop Loss must be above Entry Price."
        );

        return;
    }


    /*
    ---------------------------------------------
    TRADE VALUE USD
    ---------------------------------------------
    */

    const tradeValueUSD =
        tradeValueINR / USDINR;


    /*
    ---------------------------------------------
    MAXIMUM POSITION VALUE
    ---------------------------------------------
    */

    const maxPositionUSD =
        tradeValueUSD * leverage;


    /*
    ---------------------------------------------
    BTC QUANTITY
    ---------------------------------------------
    */

    const btcQuantity =
        maxPositionUSD / entry;


    /*
    ---------------------------------------------
    LEVERAGE MAX LOT
    ---------------------------------------------
    */

    const leverageMaxLot =
        btcQuantity / BTC_PER_LOT;


    /*
    ---------------------------------------------
    RISK BASED LOT
    ---------------------------------------------
    
    Loss per BTC = SL difference

    BTC quantity allowed =
    Risk USD / SL difference

    Lot =
    BTC quantity / 0.001
    ---------------------------------------------
    */

    const riskUSD =
        riskINR / USDINR;

    const riskBTC =
        riskUSD / slDifference;

    const riskBasedLot =
        riskBTC / BTC_PER_LOT;


    /*
    ---------------------------------------------
    FINAL LOT SIZE
    ---------------------------------------------
    */

    const finalLot =
        Math.min(
            leverageMaxLot,
            riskBasedLot
        );


    /*
    ---------------------------------------------
    ACTUAL SL LOSS
    ---------------------------------------------
    */

    const slLossUSD =
        slDifference *
        BTC_PER_LOT *
        finalLot;

    const slLossINR =
        slLossUSD * USDINR;


    /*
    ---------------------------------------------
    EXPECTED P&L
    ---------------------------------------------
    */

    const pnlUSD =
        exitDifference *
        BTC_PER_LOT *
        finalLot;

    const pnlINR =
        pnlUSD * USDINR;


    /*
    ---------------------------------------------
    DISPLAY
    ---------------------------------------------
    */

    document.getElementById("finalLot").innerHTML =
        finalLot.toLocaleString("en-IN",{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }) + " lots";


    document.getElementById("tradeResult").innerHTML =
        rupeeDollar(tradeValueINR);


    document.getElementById("maxLot").innerHTML =
        leverageMaxLot.toLocaleString("en-IN",{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }) + " lots";


    document.getElementById("riskLot").innerHTML =
        riskBasedLot.toLocaleString("en-IN",{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }) + " lots";


    document.getElementById("slLoss").innerHTML =
        rupeeDollar(slLossINR);


    /*
    ---------------------------------------------
    PRICE DIFFERENCE
    ---------------------------------------------
    */

    document.getElementById("priceDiff").innerHTML =
        signedUsdRupee(exitDifference);


    /*
    ---------------------------------------------
    P&L COLOR
    ---------------------------------------------
    */

    const pnlElement =
        document.getElementById("pnl");

    pnlElement.innerHTML =
        signedUsdRupee(pnlUSD);

    pnlElement.classList.remove(
        "profit",
        "loss"
    );

    if(pnlINR > 0){

        pnlElement.classList.add("profit");

    }else if(pnlINR < 0){

        pnlElement.classList.add("loss");

    }


    /*
    ---------------------------------------------
    SHOW RESULTS
    ---------------------------------------------
    */

    document.getElementById("results").style.display =
        "block";


    /*
    ---------------------------------------------
    POPUP
    ---------------------------------------------
    */

    document.getElementById("popupPosition").innerText =
        position.toUpperCase();

    document.getElementById("popupLot").innerText =
        finalLot.toLocaleString("en-IN",{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }) + " lots";

    const popupPnl =
        document.getElementById("popupPnl");

    popupPnl.innerHTML =
        signedUsdRupee(pnlUSD);

    popupPnl.className =
        pnlINR >= 0 ? "profit" : "loss";


    document.getElementById("popup").style.display =
        "flex";

}


/*
====================================================
CLOSE POPUP
====================================================
*/

function closePopup(){

    document.getElementById("popup").style.display =
        "none";

}


/*
====================================================
LOAD RATE
====================================================
*/

getUsdRate();

</script>

</body>
</html>
